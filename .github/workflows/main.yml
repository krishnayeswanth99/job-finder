# .github/workflows/job-alerts.yml
# Free cron hosting: runs every 15 min on GitHub's runners.
# Note: GitHub may delay scheduled runs a few minutes under load -- still
# far faster than any email alert.
name: job-alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:   # lets you trigger manually to test

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run job alert bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_alert.py

      - name: Commit seen-jobs state
        if: always()
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen_jobs.json
          git commit -m "state: $(date -u +%FT%TZ)" || echo "no state change"
          git push
